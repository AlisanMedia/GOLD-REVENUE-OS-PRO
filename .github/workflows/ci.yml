name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-publishable-key-for-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          POLAT_MULTITURN_EVIDENCE: ${{ runner.temp }}/polat-multiturn.json
          POLAT_V2_EVIDENCE: ${{ runner.temp }}/polat-multiturn-v2.json
      - run: pnpm build
      # GHSA-vfj7-8cjw-p6xm currently has no patched release and is reachable
      # only through Next's ESLint development toolchain. Keep every other
      # high/critical advisory blocking CI while tracking this exact advisory.
      - run: pnpm audit --audit-level high --ignore GHSA-vfj7-8cjw-p6xm
      - name: Production bundle smoke test
        shell: bash
        run: |
          set -euo pipefail
          pnpm start >"$RUNNER_TEMP/next-start.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/live >"$RUNNER_TEMP/live.json"; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/login >/dev/null
          grep -q '"status":"ok"' "$RUNNER_TEMP/live.json"

      - name: Retain offline Polat QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: polat-offline-qa-${{ github.sha }}
          path: |
            ${{ runner.temp }}/polat-multiturn.json
            ${{ runner.temp }}/polat-multiturn-v2.json
          if-no-files-found: warn
          retention-days: 14

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start Supabase stack
        run: supabase start
      - name: Rebuild database and execute migrations
        run: supabase db reset
      - name: Verify migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env >"$RUNNER_TEMP/supabase-status.env"
          db_url=$(sed -n 's/^DB_URL="\(.*\)"$/\1/p' "$RUNNER_TEMP/supabase-status.env")
          test -n "$db_url"
          echo "::add-mask::$db_url"
          supabase migration list --db-url "$db_url"
      - name: Lint database
        run: supabase db lint --level error --fail-on error
      - name: Verify independent offline backup recovery before UAT fixtures
        run: |
          bash supabase/tests/private_beta_release_recovery.sh
          bash supabase/tests/private_beta_recovery_snapshot.sh
      - name: Run foundation pgTAP tests
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/foundation_rls.test.sql | tee "$RUNNER_TEMP/foundation-pgtap.log"
      - name: Run tenant isolation tests
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/tenant_isolation.test.sql | tee "$RUNNER_TEMP/tenant-isolation.log"
      - name: Run Customer OS pgTAP tests
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/customer_os.test.sql | tee "$RUNNER_TEMP/customer-os-pgtap.log"
      - name: Run State and Event Engine pgTAP tests
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/state_event_engine.test.sql | tee "$RUNNER_TEMP/state-event-pgtap.log"
      - name: Run Admin Control Plane pgTAP tests
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/admin_control_plane.test.sql | tee "$RUNNER_TEMP/admin-control-plane-pgtap.log"
      - name: Run Messaging Gateway pgTAP tests
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/messaging_gateway.test.sql | tee "$RUNNER_TEMP/messaging-gateway-pgtap.log"
      - name: Run Agent Runtime pgTAP tests
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/agent_runtime.test.sql | tee "$RUNNER_TEMP/agent-runtime-pgtap.log"
      - name: Run Conversation Quality pgTAP tests
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/conversation_quality.test.sql | tee "$RUNNER_TEMP/conversation-quality-pgtap.log"
      - name: Prove concurrent transition serialization
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env >"$RUNNER_TEMP/supabase-status.env"
          db_url=$(sed -n 's/^DB_URL="\(.*\)"$/\1/p' "$RUNNER_TEMP/supabase-status.env")
          test -n "$db_url"
          echo "::add-mask::$db_url"
          bash supabase/tests/state_event_concurrency.sh "$db_url" | tee "$RUNNER_TEMP/state-event-concurrency.log"
      - name: Run Orchestrator and Lead Intelligence database tests
        run: supabase test db supabase/tests/phase8_orchestration.test.sql
      - name: Run commercial catalog, Knowledge Base and Conversion database tests
        run: supabase test db supabase/tests/phase9_commercial.test.sql
      - name: Run provider-neutral payment pgTAP tests
        run: supabase test db supabase/tests/phase10_payments.test.sql
      - name: Run Phase 11 subscription and access security assertions
        run: supabase test db supabase/tests/phase11_entitlements.test.sql
      - name: Verify read-only entitlement review visibility
        run: supabase test db supabase/tests/entitlement_review_visibility.test.sql
      - name: Run Phase 12 escalation security and behavior assertions
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/phase12_escalation.test.sql | tee "$RUNNER_TEMP/phase12-pgtap.log"
      - name: Run Phase 15 financial truth, isolation and concurrent review assertions
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/phase15_analytics.test.sql | tee "$RUNNER_TEMP/phase15-pgtap.log"
          bash supabase/tests/phase15_concurrency.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres" | tee "$RUNNER_TEMP/phase15-concurrency.log"
      - name: Run Phase 14 survey privacy, source authority and concurrency assertions
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/phase14_surveys.test.sql | tee "$RUNNER_TEMP/phase14-pgtap.log"
          bash supabase/tests/phase14_concurrency.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres" | tee "$RUNNER_TEMP/phase14-concurrency.log"
      - name: Run Phase 13 Customer Success security and lifecycle assertions
        shell: bash
        run: |
          set -o pipefail
          supabase test db supabase/tests/phase13_customer_success.test.sql | tee "$RUNNER_TEMP/phase13-pgtap.log"
          bash supabase/tests/phase13_concurrency.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres" | tee "$RUNNER_TEMP/phase13-concurrency.log"
      - name: Verify founder campaign activation and independent worker races
        shell: bash
        run: |
          set -euo pipefail
          supabase test db supabase/tests/campaign_activation.test.sql | tee "$RUNNER_TEMP/campaign-pgtap.log"
          supabase status -o env >"$RUNNER_TEMP/campaign-db.env"
          campaign_db_url=$(sed -n 's/^DB_URL="\(.*\)"$/\1/p' "$RUNNER_TEMP/campaign-db.env")
          test -n "$campaign_db_url"
          echo "::add-mask::$campaign_db_url"
          node scripts/campaign-staging-acceptance.mjs | psql "$campaign_db_url" -XqAt -v ON_ERROR_STOP=1 | tee "$RUNNER_TEMP/campaign-rollback-matrix.json"
          node --input-type=module -e 'import{readFileSync}from"node:fs";import{validateCampaignAcceptanceResult}from"./scripts/campaign-staging-run.mjs";validateCampaignAcceptanceResult(readFileSync(process.argv[1],"utf8"));' "$RUNNER_TEMP/campaign-rollback-matrix.json"
          bash supabase/tests/campaign_concurrency.sh "$campaign_db_url" | tee "$RUNNER_TEMP/campaign-concurrency.log"
          CAMPAIGN_DISPOSABLE_DB_URL="$campaign_db_url" pnpm exec vitest run tests/integration/campaign-runtime-db.test.ts | tee "$RUNNER_TEMP/campaign-native-runtime.log"
      - name: Prove concurrent escalation ingestion and notification leasing
        shell: bash
        run: |
          set -o pipefail
          bash supabase/tests/phase12_concurrency.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres" | tee "$RUNNER_TEMP/phase12-concurrency.log"
      - name: Prove concurrent payment idempotency
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env >"$RUNNER_TEMP/phase10-db.env"
          phase10_db_url=$(sed -n 's/^DB_URL="\(.*\)"$/\1/p' "$RUNNER_TEMP/phase10-db.env")
          test -n "$phase10_db_url"
          echo "::add-mask::$phase10_db_url"
          bash supabase/tests/phase10_concurrency.sh "$phase10_db_url"
      - name: Prove TEST lifetime budgets, fair queue draining and isolated authorities
        shell: bash
        run: |
          set -euo pipefail
          supabase test db supabase/tests/phase16dr1_hardening.test.sql | tee "$RUNNER_TEMP/phase16dr1-pgtap.log"
          bash supabase/tests/phase16dr1_concurrency.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres" | tee "$RUNNER_TEMP/phase16dr1-concurrency.log"
      - name: Prove concurrent Phase 11 entitlement consumers and access leases
        run: bash supabase/tests/phase11_concurrency.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
      - name: Prove concurrent specialist task leasing
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env >"$RUNNER_TEMP/phase8-db.env"
          db_url=$(sed -n 's/^DB_URL="\(.*\)"$/\1/p' "$RUNNER_TEMP/phase8-db.env")
          test -n "$db_url"
          echo "::add-mask::$db_url"
          bash supabase/tests/phase8_concurrency.sh "$db_url"
      - name: Verify private beta authority, native runtime and dedicated TEST Stars offline
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env >"$RUNNER_TEMP/private-beta-db.env"
          beta_db_url=$(sed -n 's/^DB_URL="\(.*\)"$/\1/p' "$RUNNER_TEMP/private-beta-db.env")
          test -n "$beta_db_url"
          echo "::add-mask::$beta_db_url"
          supabase test db supabase/tests/private_beta_uat.test.sql supabase/tests/private_beta_uat_pagination.test.sql supabase/tests/private_beta_native_runtime.test.sql supabase/tests/private_beta_stars.test.sql supabase/tests/private_beta_openai.test.sql supabase/tests/private_beta_business.test.sql supabase/tests/private_beta_business_discovery.test.sql | tee "$RUNNER_TEMP/private-beta-pgtap.log"
          bash supabase/tests/private_beta_uat_concurrency.sh "$beta_db_url" | tee "$RUNNER_TEMP/private-beta-concurrency.log"
          bash supabase/tests/private_beta_stars_concurrency.sh "$beta_db_url" | tee "$RUNNER_TEMP/private-beta-stars-concurrency.log"
          bash supabase/tests/private_beta_business_concurrency.sh "$beta_db_url" | tee "$RUNNER_TEMP/private-beta-business-concurrency.log"
          POLAT_BETA_MODEL_DB_URL="$beta_db_url" pnpm exec vitest run tests/integration/polat-private-beta-provider-db.test.ts tests/integration/polat-openai-private-beta-provider-db.test.ts | tee "$RUNNER_TEMP/private-beta-provider-db.log"
          POLAT_BETA_BUSINESS_DB_URL="$beta_db_url" pnpm exec vitest run tests/integration/private-beta-business-db.test.ts | tee "$RUNNER_TEMP/private-beta-business-db.log"
          POLAT_BETA_RUNTIME_DB_URL="$beta_db_url" pnpm exec vitest run tests/integration/private-beta-runtime-db.test.ts | tee "$RUNNER_TEMP/private-beta-runtime-db.log"
          POLAT_BETA_OPENAI_BUSINESS_DB_URL="$beta_db_url" pnpm exec vitest run tests/integration/private-beta-openai-business-runtime-db.test.ts | tee "$RUNNER_TEMP/private-beta-openai-business-runtime-db.log"
      - name: Retain private beta offline acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-beta-offline-${{ github.sha }}
          path: ${{ runner.temp }}/private-beta-*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Export local Auth credentials safely
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env >"$RUNNER_TEMP/supabase-status.env"
          api_url=$(sed -n 's/^API_URL="\(.*\)"$/\1/p' "$RUNNER_TEMP/supabase-status.env")
          publishable_key=$(sed -n 's/^ANON_KEY="\(.*\)"$/\1/p' "$RUNNER_TEMP/supabase-status.env")
          secret_key=$(sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p' "$RUNNER_TEMP/supabase-status.env")
          test -n "$api_url"
          test -n "$publishable_key"
          test -n "$secret_key"
          echo "::add-mask::$publishable_key"
          echo "::add-mask::$secret_key"
          echo "SUPABASE_URL=$api_url" >>"$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY=$publishable_key" >>"$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$secret_key" >>"$GITHUB_ENV"
      - name: Run authentication smoke test
        run: pnpm --filter @gold-revenue-os/web auth:smoke
      - name: Run real sandbox webhook and Admin Payments HTTP acceptance
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env >"$RUNNER_TEMP/phase10-http-db.env"
          phase10_db_url=$(sed -n 's/^DB_URL="\(.*\)"$/\1/p' "$RUNNER_TEMP/phase10-http-db.env")
          test -n "$phase10_db_url"
          echo "::add-mask::$phase10_db_url"
          export PHASE10_LOCAL_DB_URL="$phase10_db_url"
          export PHASE10_LOCAL_APP_URL=http://127.0.0.1:3100
          export NEXT_PUBLIC_APP_URL="$PHASE10_LOCAL_APP_URL"
          export NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          export CRON_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$CRON_SECRET"
          export SURVEY_SANDBOX_FORMS_ENABLED=true
          export PAYMENT_TEST_WEBHOOKS_ENABLED=true
          export PAYMENT_TEST_WEBHOOK_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$PAYMENT_TEST_WEBHOOK_SECRET"
          export PHASE10_EVIDENCE_FILE="$RUNNER_TEMP/phase10-http-acceptance.json"
          export VALIDATED_SHA="$GITHUB_SHA"
          pnpm build
          pnpm --filter @gold-revenue-os/web start --port 3100 >"$RUNNER_TEMP/phase10-http-server.log" 2>&1 &
          phase10_server_pid=$!
          trap 'kill "$phase10_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/api/health/live >/dev/null; then break; fi
            sleep 1
          done
          node apps/web/scripts/phase10-staging.mjs
          export PHASE11_EVIDENCE_FILE="$RUNNER_TEMP/phase11-http-acceptance.json"
          node apps/web/scripts/phase11-staging.mjs
          export PHASE12_LOCAL_DB_URL="$phase10_db_url"
          export PHASE12_LOCAL_APP_URL=http://127.0.0.1:3100
          export PHASE12_EVIDENCE_FILE="$RUNNER_TEMP/phase12-http-acceptance.json"
          node apps/web/scripts/phase12-staging.mjs
          export PHASE13_LOCAL_DB_URL="$phase10_db_url"
          export PHASE13_LOCAL_APP_URL=http://127.0.0.1:3100
          export PHASE13_EVIDENCE_FILE="$RUNNER_TEMP/phase13-http-acceptance.json"
          node apps/web/scripts/phase13-staging.mjs
          export PHASE14_LOCAL_DB_URL="$phase10_db_url"
          export PHASE14_LOCAL_APP_URL=http://127.0.0.1:3100
          export PHASE14_EVIDENCE_FILE="$RUNNER_TEMP/phase14-http-acceptance.json"
          node apps/web/scripts/phase14-staging.mjs
          export PHASE15_LOCAL_DB_URL="$phase10_db_url"
          export PHASE15_LOCAL_APP_URL=http://127.0.0.1:3100
          export PHASE15_EVIDENCE_FILE="$RUNNER_TEMP/phase15-http-acceptance.json"
          node apps/web/scripts/phase15-staging.mjs
          export SIGNAL_LOCAL_DB_URL="$phase10_db_url"
          export SIGNAL_LOCAL_APP_URL=http://127.0.0.1:3100
          export SIGNAL_HTTP_EVIDENCE_FILE="$RUNNER_TEMP/signal-http-acceptance.json"
          node apps/web/scripts/signal-operations-http.mjs
          export POLAT_LOCAL_DB_URL="$phase10_db_url"
          export POLAT_LOCAL_APP_URL=http://127.0.0.1:3100
          export POLAT_HTTP_EVIDENCE_FILE="$RUNNER_TEMP/polat-http-acceptance.json"
          node apps/web/scripts/polat-operations-http.mjs
      - name: Upload sandbox HTTP acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-http-acceptance
          path: ${{ runner.temp }}/phase10-http-acceptance.json
          retention-days: 14
      - name: Upload Phase 11 HTTP/Admin acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-http-acceptance
          path: ${{ runner.temp }}/phase11-http-acceptance.json
          retention-days: 14
      - name: Upload Phase 12 HTTP/Admin acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-http-acceptance
          path: ${{ runner.temp }}/phase12-http-acceptance.json
          retention-days: 14
      - name: Upload Phase 13 authenticated HTTP and locale evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase13-http-acceptance
          path: ${{ runner.temp }}/phase13-http-acceptance.json
          retention-days: 14
      - name: Upload Phase 15 authenticated analytics and financial truth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase15-http-acceptance
          path: ${{ runner.temp }}/phase15-http-acceptance.json
          retention-days: 14
      - name: Upload Phase 14 authenticated HTTP and privacy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase14-http-acceptance
          path: ${{ runner.temp }}/phase14-http-acceptance.json
          retention-days: 14
      - name: Verify synthetic financial evidence persistence and real backend races
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env >"$RUNNER_TEMP/fse-supabase-status.env"
          db_url=$(sed -n 's/^DB_URL="\(.*\)"$/\1/p' "$RUNNER_TEMP/fse-supabase-status.env")
          test -n "$db_url"
          echo "::add-mask::$db_url"
          supabase test db supabase/tests/phase16c1b_financial_evidence.test.sql | tee "$RUNNER_TEMP/phase16c1b-pgtap.log"
          FSE_DISPOSABLE_DB_URL="$db_url" pnpm exec vitest run tests/integration/phase16c1b-evidence-contracts.test.ts | tee "$RUNNER_TEMP/phase16c1b-v1-db-bridge.log"
          bash supabase/tests/phase16c1b_concurrency.sh "$db_url" | tee "$RUNNER_TEMP/phase16c1b-concurrency.log"
          psql "$db_url" -X -v ON_ERROR_STOP=1 -f supabase/tests/phase16c1b_read_plans.sql | tee "$RUNNER_TEMP/phase16c1b-read-plans.log"
      - name: Verify synthetic signal ingestion and concurrent replay
        shell: bash
        run: |
          set -euo pipefail
          supabase test db supabase/tests/signal_ingestion.test.sql | tee "$RUNNER_TEMP/signal-ingestion-pgtap.log"
          bash supabase/tests/signal_ingestion_concurrency.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres" | tee "$RUNNER_TEMP/signal-ingestion-concurrency.log"
      - name: Verify synthetic distribution, actual v1 bridge, crash recovery and latency
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env >"$RUNNER_TEMP/signal-db.env"
          db_url=$(sed -n 's/^DB_URL="\(.*\)"$/\1/p' "$RUNNER_TEMP/signal-db.env")
          test -n "$db_url"
          echo "::add-mask::$db_url"
          supabase test db supabase/tests/signal_distribution.test.sql | tee "$RUNNER_TEMP/signal-distribution-pgtap.log"
          SIGNAL_DISPOSABLE_DB_URL="$db_url" pnpm exec vitest run tests/integration/signal-distribution-db.test.ts | tee "$RUNNER_TEMP/signal-distribution-v1-bridge.log"
          bash supabase/tests/signal_distribution_concurrency.sh "$db_url" | tee "$RUNNER_TEMP/signal-distribution-concurrency.log"
          bash supabase/tests/signal_notification_wakeup.sh "$db_url" | tee "$RUNNER_TEMP/signal-notification-wakeup.log"
          bash supabase/tests/signal_distribution_benchmark.sh "$db_url" | tee "$RUNNER_TEMP/signal-distribution-benchmark.log"
          SIGNAL_BENCHMARK_DIR="$RUNNER_TEMP" pnpm exec vitest run tests/integration/signal-normalization-benchmark.test.ts | tee "$RUNNER_TEMP/signal-normalization.log"
          psql "$db_url" -X -v ON_ERROR_STOP=1 -f supabase/tests/signal_distribution_read_plans.sql | tee "$RUNNER_TEMP/signal-distribution-plans.log"
      - name: Verify optional synthetic independent-message waves
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env >"$RUNNER_TEMP/signal-wave-db.env"
          wave_db_url=$(sed -n 's/^DB_URL="\(.*\)"$/\1/p' "$RUNNER_TEMP/signal-wave-db.env")
          test -n "$wave_db_url"
          echo "::add-mask::$wave_db_url"
          supabase test db supabase/tests/signal_wave.test.sql | tee "$RUNNER_TEMP/signal-wave-pgtap.log"
          bash supabase/tests/signal_wave_concurrency.sh "$wave_db_url" | tee "$RUNNER_TEMP/signal-wave-concurrency.log"
          SIGNAL_DISPOSABLE_DB_URL="$wave_db_url" SIGNAL_BENCHMARK_OUTPUT="$RUNNER_TEMP/signal-wave-benchmark.json" pnpm exec vitest run tests/integration/signal-wave-benchmark.test.ts | tee "$RUNNER_TEMP/signal-wave-benchmark.log"
          psql "$wave_db_url" -X -v ON_ERROR_STOP=1 -f supabase/tests/signal_wave_read_plans.sql | tee "$RUNNER_TEMP/signal-wave-plans.log"
      - name: Verify bounded read-only signal operations
        shell: bash
        run: |
          set -euo pipefail
          supabase test db supabase/tests/signal_operations.test.sql | tee "$RUNNER_TEMP/signal-operations-pgtap.log"
          supabase status -o env >"$RUNNER_TEMP/signal-operations-db.env"
          signal_db_url=$(sed -n 's/^DB_URL="\(.*\)"$/\1/p' "$RUNNER_TEMP/signal-operations-db.env")
          test -n "$signal_db_url"
          echo "::add-mask::$signal_db_url"
          bash supabase/tests/signal_operations_read_concurrency.sh "$signal_db_url" | tee "$RUNNER_TEMP/signal-operations-concurrency.log"
          psql "$signal_db_url" -X -v ON_ERROR_STOP=1 -f supabase/tests/signal_operations_read_plans.sql | tee "$RUNNER_TEMP/signal-operations-read-plans.log"
      - name: Verify synthetic source capability and gap recovery
