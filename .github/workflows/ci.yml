          echo "::add-mask::$source_db_url"
          supabase test db supabase/tests/signal_recovery.test.sql | tee "$RUNNER_TEMP/signal-recovery-pgtap.log"
          bash supabase/tests/signal_recovery_concurrency.sh "$source_db_url" | tee "$RUNNER_TEMP/signal-recovery-concurrency.log"
