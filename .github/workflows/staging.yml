name: Staging Validation

on:
  workflow_dispatch:
    inputs:
      validated_commit_sha:
        description: Full commit SHA whose Application and Database checks passed
        required: true
        type: string
      run_vercel:
        description: Run Vercel staging only after Supabase validation succeeds
        required: false
        default: false
        type: boolean
      run_telegram_live:
        description: Register and validate the staging Telegram webhook after Vercel succeeds
        required: false
        default: false
        type: boolean
      run_agent_worker:
        description: Deploy the isolated staging project as its production target and validate the Phase 6 cron worker
        required: false
        default: false
        type: boolean
      configure_openai_shadow:
        description: Attach OpenAI staging secrets and activate the Phase 7 agent in SHADOW mode
        required: false
        default: false
        type: boolean
      verify_openai_evidence:
        description: Require at least three persisted live OpenAI shadow invocations
        required: false
        default: false
        type: boolean
      retry_resolved_openai_quota_tasks:
        description: Requeue audited OpenAI quota dead letters after the owner confirms billing is restored
        required: false
        default: false
        type: boolean
      enable_phase8_orchestration:
        description: Enable future-source-only Phase 8 profiling on the authorized staging tenant after deployment
        required: false
        default: false
        type: boolean

      run_phase15_sandbox:
        description: Isolated synthetic analytics and financial-truth acceptance; no provider send or LIVE authority
        required: false
        default: false
        type: boolean

      run_phase14_sandbox:
        description: Isolated synthetic survey, privacy, intelligence and localized Admin acceptance; zero provider messages
        required: false
        default: false
        type: boolean

      run_phase13_sandbox:
        description: Validate isolated synthetic Customer Success, Admin and locale workflows; no customer/provider send
        required: false
        default: false
        type: boolean

      run_phase12_sandbox:
        description: Validate isolated Phase 12 escalation and Admin acceptance
        required: false
        default: false
        type: boolean
      phase12_admin_chat_id:
        description: Optional exact owner-approved private manager chat ID; empty means synthetic acceptance only
        required: false
        default: ""
        type: string
      discover_phase12_admin:
        description: Read-only dedicated notification bot and private admin group preflight; no deployment or message
        required: false
        default: false
        type: boolean

      run_phase11_sandbox:
        description: Validate isolated Phase 11 subscriptions and access without real Telegram calls
        required: false
        default: false
        type: boolean

      run_phase10_sandbox:
        description: Validate isolated Phase 10 test adapters and restore the sandbox webhook window
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  checks: read

concurrency:
  group: staging-validation
  cancel-in-progress: false

jobs:
  discover_phase12_admin:
    name: Phase 12 private admin destination discovery
    if: ${{ inputs.discover_phase12_admin == true && inputs.run_phase14_sandbox != true && inputs.run_phase15_sandbox != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    env:
      ESCALATION_TELEGRAM_BOT_TOKEN: ${{ secrets.ESCALATION_TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Verify dedicated bot and bounded private group evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const evidence={mode:'read-only; no offset, webhook changes or sends',secret_configured:Boolean(process.env.ESCALATION_TELEGRAM_BOT_TOKEN),status:'FAILED'};
          const call=async(method,body={})=>{
            const r=await fetch(`https://api.telegram.org/bot${process.env.ESCALATION_TELEGRAM_BOT_TOKEN}/${method}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(12000)});
            const d=await r.json();if(!r.ok||!d.ok)throw Error('PREFLIGHT_'+method+'_FAILED');return d.result;
          };
          try {
            if(!evidence.secret_configured)throw Error('STAGING_SECRET_MISSING');
            const me=await call('getMe');if(!me.is_bot||String(me.id)==='8673054837'||!me.username)throw Error('DEDICATED_BOT_REQUIRED');
            evidence.bot={id:String(me.id),username:me.username};
            const webhook=await call('getWebhookInfo');evidence.webhook_configured=Boolean(webhook.url);evidence.pending_updates=webhook.pending_update_count;
            if(webhook.url){evidence.status='EXISTING_WEBHOOK';throw Error('USE_EXISTING_WEBHOOK_EVENT_PATH');}
            // New owner-created token has no consumer in this repository. Workflow concurrency excludes another discovery run.
            const updates=await call('getUpdates',{limit:20,timeout:0});evidence.updates_inspected=updates.length;
            const candidates=new Map();
            for(const u of updates){const m=u.message;const membership=u.my_chat_member;
              const chat=m?.chat??membership?.chat;
              if(!chat||!['group','supergroup'].includes(chat.type)||String(chat.id)==='-1003944824067'||chat.username)continue;
              // Bind discovery to the owner's previously verified Telegram identity; another chat cannot self-approve by copying the test text.
              if((m?.from?.id??membership?.from?.id)!==6890052501)continue;
              const text=m?.text?.trim();
              if(text==='Phase 12 admin bildirim testi'||text?.split(/\s/u)[0]?.toLowerCase()==='/chatid@'+me.username.toLowerCase()||membership?.new_chat_member?.user?.id===me.id)candidates.set(String(chat.id),chat);
            }
            if(candidates.size!==1){evidence.status=candidates.size?'AMBIGUOUS_GROUP':'COMMAND_REQUIRED';throw Error(candidates.size?'UNIQUE_PRIVATE_GROUP_REQUIRED':'SEND_ONE_ADDRESSED_COMMAND');}
            const id=[...candidates.keys()][0],chat=await call('getChat',{chat_id:id}),member=await call('getChatMember',{chat_id:id,user_id:me.id});
            if(String(chat.id)!==id||!['group','supergroup'].includes(chat.type)||chat.username)throw Error('PRIVATE_GROUP_REQUIRED');
            const canSend=['creator','administrator'].includes(member.status)||(member.status==='member'&&chat.permissions?.can_send_messages!==false)||(member.status==='restricted'&&member.is_member&&member.can_send_messages);
            evidence.destination={chat_id:id,type:chat.type,title:chat.title,bot_membership:member.status,can_send_messages:Boolean(canSend),owner_source_verified:true,separate_from_vip:true};
            if(!canSend)throw Error('BOT_SEND_PERMISSION_REQUIRED');evidence.status='VERIFIED';
          }catch(error){evidence.reason=error instanceof Error&&/^[A-Z0-9_]+$/u.test(error.message)?error.message:'PREFLIGHT_UNAVAILABLE';}
          writeFileSync(process.env.RUNNER_TEMP+'/phase12-admin-discovery.json',JSON.stringify(evidence,null,2),{mode:0o600});
          console.log(JSON.stringify(evidence));
          if(evidence.status!=='VERIFIED'&&evidence.status!=='COMMAND_REQUIRED')process.exitCode=1;
          NODE
      - name: Preserve sanitized discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-admin-discovery
          path: ${{ runner.temp }}/phase12-admin-discovery.json
          retention-days: 14

  staging_supabase:
    name: Supabase staging validation
    if: ${{ inputs.discover_phase12_admin != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
    steps:
      - name: Enforce successful CI gate
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ inputs.validated_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VALIDATED_SHA" =~ ^[0-9a-f]{40}$ ]]
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          test "$VALIDATED_SHA" = "$main_sha"
          application=$(gh api "repos/$GITHUB_REPOSITORY/commits/$VALIDATED_SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "Application") | .conclusion' | head -n 1)
          database=$(gh api "repos/$GITHUB_REPOSITORY/commits/$VALIDATED_SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "Database") | .conclusion' | head -n 1)
          test "$application" = "success"
          test "$database" = "success"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.validated_commit_sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Validate required staging secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in \
            SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD STAGING_SUPABASE_PROJECT_ID \
            SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY; do
            test -n "${!key:-}" || { echo "Missing staging secret: $key"; exit 1; }
          done
      - name: Validate Phase 15 no-provider acceptance scope
        if: ${{ inputs.run_phase15_sandbox == true }}
        env:
          PHASE15_ADMIN_CHAT: ${{ inputs.phase12_admin_chat_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.run_vercel }}" = "true"
          test "${{ inputs.run_agent_worker }}" = "true"
          test "${{ inputs.discover_phase12_admin }}" = "false"
          test "${{ inputs.run_telegram_live }}" = "false"
          test "${{ inputs.run_phase10_sandbox }}" = "false"
          test "${{ inputs.run_phase11_sandbox }}" = "false"
          test "${{ inputs.run_phase12_sandbox }}" = "false"
          test "${{ inputs.run_phase13_sandbox }}" = "false"
          test "${{ inputs.run_phase14_sandbox }}" = "false"
          test "${{ inputs.configure_openai_shadow }}" = "false"
          test "${{ inputs.verify_openai_evidence }}" = "false"
          test "${{ inputs.retry_resolved_openai_quota_tasks }}" = "false"
          test "${{ inputs.enable_phase8_orchestration }}" = "false"
          test -z "$PHASE15_ADMIN_CHAT"
      - name: Verify exact Phase 15 staging database
        if: ${{ inputs.run_phase15_sandbox == true }}
        shell: bash
        run: test "$STAGING_SUPABASE_PROJECT_ID" = "xqvwkghpmezcpgugetqc"
      - name: Link isolated staging database
        run: supabase link --project-ref "$STAGING_SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations to staging
        run: supabase db push
      - name: Verify staging migration history
        run: supabase migration list
      - name: Lint staging database
        run: supabase db lint --linked --level error --fail-on error
      - name: Run staging authentication smoke test
        run: pnpm --filter @gold-revenue-os/web auth:smoke
      - name: Write validation evidence
        if: always()
        shell: bash
        run: |
          {
            echo "commit=${{ inputs.validated_commit_sha }}"
            echo "ci_gate=Application:success,Database:success"
            echo "supabase_project=${STAGING_SUPABASE_PROJECT_ID}"
            echo "migration_push=completed-or-step-failed"
            echo "migration_list=completed-or-step-failed"
            echo "database_lint=completed-or-step-failed"
            echo "auth_smoke=completed-or-step-failed"
          } >"$RUNNER_TEMP/staging-supabase-validation.txt"
      - name: Upload Supabase staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-supabase-validation-evidence
          path: ${{ runner.temp }}/staging-supabase-validation.txt
          retention-days: 14

  staging_vercel:
    name: Vercel staging validation
    if: ${{ inputs.run_vercel == true && needs.staging_supabase.result == 'success' }}
    needs: staging_supabase
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_APP_URL: https://gold-revenue-os-staging.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      TELEGRAM_STAGING_TENANT_ID: ${{ secrets.TELEGRAM_STAGING_TENANT_ID }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      ESCALATION_TELEGRAM_BOT_TOKEN: ${{ secrets.ESCALATION_TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Enforce successful CI gate
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ inputs.validated_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VALIDATED_SHA" =~ ^[0-9a-f]{40}$ ]]
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          test "$VALIDATED_SHA" = "$main_sha"
          application=$(gh api "repos/$GITHUB_REPOSITORY/commits/$VALIDATED_SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "Application") | .conclusion' | head -n 1)
          database=$(gh api "repos/$GITHUB_REPOSITORY/commits/$VALIDATED_SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "Database") | .conclusion' | head -n 1)
          test "$application" = "success"
          test "$database" = "success"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.validated_commit_sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate required Vercel secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in \
            VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID \
            NEXT_PUBLIC_APP_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            test -n "${!key:-}" || { echo "Missing staging secret: $key"; exit 1; }
          done
      - name: Validate required Telegram staging secrets
        if: ${{ inputs.run_telegram_live == true }}
        shell: bash
        run: |
          set -euo pipefail
          for key in TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET TELEGRAM_STAGING_TENANT_ID SUPABASE_SECRET_KEY; do
            test -n "${!key:-}" || { echo "Missing staging secret: $key"; exit 1; }
          done
          [[ "$TELEGRAM_STAGING_TENANT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$TELEGRAM_WEBHOOK_SECRET" =~ ^[A-Za-z0-9_-]{16,256}$ ]]
      - name: Validate required Agent Runtime staging secrets
        if: ${{ inputs.run_agent_worker == true }}
        shell: bash
        run: |
          set -euo pipefail
          for key in CRON_SECRET TELEGRAM_STAGING_TENANT_ID SUPABASE_SECRET_KEY; do
            test -n "${!key:-}" || { echo "Missing Phase 6 staging secret: $key"; exit 1; }
          done
          test "${#CRON_SECRET}" -ge 32
          [[ "$TELEGRAM_STAGING_TENANT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
      - name: Validate required OpenAI staging secrets
        if: ${{ inputs.configure_openai_shadow == true || inputs.verify_openai_evidence == true || inputs.retry_resolved_openai_quota_tasks == true }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.run_agent_worker }}" = "true"
          if test "${{ inputs.retry_resolved_openai_quota_tasks }}" = "true"; then
            test "${{ inputs.configure_openai_shadow }}" = "true"
          fi
          for key in OPENAI_API_KEY OPENAI_MODEL CRON_SECRET TELEGRAM_STAGING_TENANT_ID SUPABASE_SECRET_KEY; do
            test -n "${!key:-}" || { echo "Missing Phase 7 staging secret: $key"; exit 1; }
          done
          test "${#OPENAI_API_KEY}" -ge 20
          [[ "$OPENAI_MODEL" =~ ^[A-Za-z0-9._:-]{2,120}$ ]]
      - name: Validate Phase 15 no-provider acceptance scope
        if: ${{ inputs.run_phase15_sandbox == true }}
        env:
          PHASE15_ADMIN_CHAT: ${{ inputs.phase12_admin_chat_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.run_vercel }}" = "true"
          test "${{ inputs.run_agent_worker }}" = "true"
          test "${{ inputs.discover_phase12_admin }}" = "false"
          test "${{ inputs.run_telegram_live }}" = "false"
          test "${{ inputs.run_phase10_sandbox }}" = "false"
          test "${{ inputs.run_phase11_sandbox }}" = "false"
          test "${{ inputs.run_phase12_sandbox }}" = "false"
          test "${{ inputs.run_phase13_sandbox }}" = "false"
          test "${{ inputs.run_phase14_sandbox }}" = "false"
          test "${{ inputs.configure_openai_shadow }}" = "false"
          test "${{ inputs.verify_openai_evidence }}" = "false"
          test "${{ inputs.retry_resolved_openai_quota_tasks }}" = "false"
          test "${{ inputs.enable_phase8_orchestration }}" = "false"
          test -z "$PHASE15_ADMIN_CHAT"
      - name: Validate isolated Phase 14 acceptance boundaries
        if: ${{ inputs.run_phase14_sandbox == true }}
        env:
          REQUESTED_ADMIN_CHAT: ${{ inputs.phase12_admin_chat_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.run_agent_worker }}" = "true"
          test "${{ inputs.run_telegram_live }}" = "false"
          test "${{ inputs.run_phase10_sandbox }}" = "false"
          test "${{ inputs.run_phase11_sandbox }}" = "false"
          test "${{ inputs.run_phase12_sandbox }}" = "false"
          test "${{ inputs.run_phase13_sandbox }}" = "false"
          test "${{ inputs.configure_openai_shadow }}" = "false"
          test "${{ inputs.verify_openai_evidence }}" = "false"
          test "${{ inputs.retry_resolved_openai_quota_tasks }}" = "false"
          test "${{ inputs.enable_phase8_orchestration }}" = "false"
          test -z "$REQUESTED_ADMIN_CHAT"
      - name: Validate isolated Phase 13 acceptance boundaries
        if: ${{ inputs.run_phase13_sandbox == true }}
        env:
          PHASE13_REQUESTED_ADMIN_CHAT: ${{ inputs.phase12_admin_chat_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.run_agent_worker }}" = "true"
          test "${{ inputs.run_telegram_live }}" = "false"
          test "${{ inputs.run_phase10_sandbox }}" = "false"
          test "${{ inputs.run_phase11_sandbox }}" = "false"
          test "${{ inputs.run_phase12_sandbox }}" = "false"
          test "${{ inputs.configure_openai_shadow }}" = "false"
          test "${{ inputs.verify_openai_evidence }}" = "false"
          test "${{ inputs.retry_resolved_openai_quota_tasks }}" = "false"
          test "${{ inputs.enable_phase8_orchestration }}" = "false"
          test -z "$PHASE13_REQUESTED_ADMIN_CHAT"
      - name: Prepare exact Phase 12 notification acceptance scope
        if: ${{ inputs.run_phase12_sandbox == true }}
        env:
          APPROVED_ADMIN_CHAT: ${{ inputs.phase12_admin_chat_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {randomUUID} from 'node:crypto';
          import {appendFileSync} from 'node:fs';
          appendFileSync(process.env.GITHUB_ENV,`PHASE12_TENANT_ID=${randomUUID()}\n`);
          const chat=process.env.APPROVED_ADMIN_CHAT;
          if(chat){
            if(!/^-?[1-9][0-9]{0,15}$/.test(chat)||chat==='-1003944824067'||!process.env.ESCALATION_TELEGRAM_BOT_TOKEN)throw Error('APPROVED_SEPARATE_ADMIN_BOT_REQUIRED');
            const call=async(method,body)=>{const r=await fetch(`https://api.telegram.org/bot${process.env.ESCALATION_TELEGRAM_BOT_TOKEN}/${method}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(10000)});const d=await r.json();if(!r.ok||!d.ok)throw Error('ADMIN_BOT_PREFLIGHT_FAILED');return d.result;};
            const me=await call('getMe',{}),dest=await call('getChat',{chat_id:chat});
            if(!me.is_bot||String(me.id)==='8673054837'||String(dest.id)!==chat||!['private','group','supergroup'].includes(dest.type)||(dest.type!=='private'&&dest.username))throw Error('ADMIN_DESTINATION_DENIED');
            appendFileSync(process.env.GITHUB_ENV,`ESCALATION_TELEGRAM_CHAT_ID=${chat}\nESCALATION_TELEGRAM_BOT_ID=${me.id}\n`);
          }
          NODE
      - name: Verify Vercel project identity
        shell: bash
        run: |
          set -euo pipefail

          resolved_project_id=$(printf '%s' "$VERCEL_PROJECT_ID" | tr -d '[:space:]')
          resolved_org_id=$(printf '%s' "$VERCEL_ORG_ID" | tr -d '[:space:]')
          [[ "$resolved_project_id" =~ ^prj_[A-Za-z0-9]+$ ]]
          [[ "$resolved_org_id" =~ ^(team|user)_[A-Za-z0-9]+$ ]]

          response="$RUNNER_TEMP/vercel-project.json"
          curl \
            --fail-with-body \
            --retry 3 \
            --retry-all-errors \
            --silent \
            --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$resolved_project_id?teamId=$resolved_org_id" >"$response"

          test "$(jq -r '.id' "$response")" = "$resolved_project_id"
          test "$(jq -r '.name' "$response")" = "gold-revenue-os-staging"
          [[ "$resolved_org_id" =~ ^team_[A-Za-z0-9]+$ ]]

          team_response="$RUNNER_TEMP/vercel-team.json"
          curl \
            --fail-with-body \
            --retry 3 \
            --retry-all-errors \
            --silent \
            --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/teams/$resolved_org_id" >"$team_response"
          resolved_team_slug=$(jq -r '.slug // empty' "$team_response")
          [[ "$resolved_team_slug" =~ ^[a-z0-9][a-z0-9-]{0,47}$ ]]

          echo "VERCEL_PROJECT_ID=$resolved_project_id" >>"$GITHUB_ENV"
          echo "VERCEL_ORG_ID=$resolved_org_id" >>"$GITHUB_ENV"
          echo "VERCEL_TEAM_SLUG=$resolved_team_slug" >>"$GITHUB_ENV"
          echo "Verified the exact Vercel project, team ID, and team scope without exposing credentials." >>"$GITHUB_STEP_SUMMARY"
      - name: Capture preserved agent failure evidence before publication
        if: ${{ inputs.run_agent_worker == true }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "apikey: $SUPABASE_SECRET_KEY" \
            --header "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/agent_tasks?select=id&tenant_id=eq.$TELEGRAM_STAGING_TENANT_ID&status=eq.DEAD_LETTER&order=id" \
            >"$RUNNER_TEMP/phase6-preserved-failures.json"
          jq -e 'type == "array"' "$RUNNER_TEMP/phase6-preserved-failures.json" >/dev/null
      - name: Pull isolated Vercel staging preview configuration
        if: ${{ inputs.run_agent_worker != true }}
        run: pnpm dlx vercel@59.16.0 pull --yes --environment=preview --scope="$VERCEL_TEAM_SLUG"
      - name: Pull isolated Vercel staging production-target configuration
        if: ${{ inputs.run_agent_worker == true }}
        run: pnpm dlx vercel@59.16.0 pull --yes --environment=production --scope="$VERCEL_TEAM_SLUG"
      - name: Materialize isolated staging production build environment
        if: ${{ inputs.run_agent_worker == true }}
        env:
          CONFIGURE_OPENAI_SHADOW: ${{ inputs.configure_openai_shadow }}
          RUN_PHASE10_SANDBOX: ${{ inputs.run_phase10_sandbox || inputs.run_phase11_sandbox }}
          RUN_PHASE12_SANDBOX: ${{ inputs.run_phase12_sandbox || inputs.run_phase13_sandbox || inputs.run_phase14_sandbox || inputs.run_phase15_sandbox }}
        shell: bash
        run: |
          set -euo pipefail
          # The isolated staging project's production target exists only so
          # Vercel Cron is active. Source its build values from the already
          # protected GitHub staging environment instead of duplicating them
          # in Vercel or printing them to the log.
          node <<'NODE'
          const fs = require("node:fs");
          const names = [
            "NEXT_PUBLIC_APP_URL",
            "NEXT_PUBLIC_SUPABASE_URL",
            "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY",
            "SUPABASE_SECRET_KEY",
            "TELEGRAM_STAGING_TENANT_ID",
            "CRON_SECRET",
          ];
          if (process.env.CONFIGURE_OPENAI_SHADOW === "true" || process.env.RUN_PHASE10_SANDBOX === "true" || process.env.RUN_PHASE12_SANDBOX === "true") {
            names.push("OPENAI_API_KEY", "OPENAI_MODEL");
          }
          const content = names
            .map((name) => `${name}=${JSON.stringify(process.env[name] ?? "")}`)
            .join("\\n");
          fs.writeFileSync(".vercel/.env.production.local", `${content}\\n`, { mode: 0o600 });
          NODE
      - name: Prepare time-bounded sandbox webhook secret
        if: ${{ inputs.run_phase10_sandbox == true || inputs.run_phase11_sandbox == true }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.run_agent_worker }}" = "true"
          test "${{ inputs.run_telegram_live }}" = "false"
          test "${{ inputs.configure_openai_shadow }}" = "false"
          test "${{ inputs.retry_resolved_openai_quota_tasks }}" = "false"
          phase10_secret=$(openssl rand -hex 32)
          echo "::add-mask::$phase10_secret"
          echo "PAYMENT_TEST_WEBHOOK_SECRET=$phase10_secret" >>"$GITHUB_ENV"
          echo "PAYMENT_TEST_WEBHOOKS_ENABLED=true" >>"$GITHUB_ENV"
      - name: Build staging preview deployment
        if: ${{ inputs.run_agent_worker != true }}
        run: pnpm dlx vercel@59.16.0 build --scope="$VERCEL_TEAM_SLUG"
      - name: Build isolated staging production-target deployment
        if: ${{ inputs.run_agent_worker == true }}
        run: pnpm dlx vercel@59.16.0 build --prod --scope="$VERCEL_TEAM_SLUG"
      - name: Deploy staging artifact
        id: deploy
        shell: bash
        env:
          RUN_TELEGRAM_LIVE: ${{ inputs.run_telegram_live }}
          RUN_AGENT_WORKER: ${{ inputs.run_agent_worker }}
          CONFIGURE_OPENAI_SHADOW: ${{ inputs.configure_openai_shadow }}
          RUN_PHASE10_SANDBOX: ${{ inputs.run_phase10_sandbox || inputs.run_phase11_sandbox }}
          RUN_PHASE12_SANDBOX: ${{ inputs.run_phase12_sandbox || inputs.run_phase13_sandbox || inputs.run_phase14_sandbox || inputs.run_phase15_sandbox }}
        run: |
          set -euo pipefail

          deploy_args=(
            --prebuilt
           
            --scope="$VERCEL_TEAM_SLUG"
            --env "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY"
          )

          if test "$RUN_TELEGRAM_LIVE" = "true"; then
            deploy_args+=(
              --env "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
              --env "TELEGRAM_WEBHOOK_SECRET=$TELEGRAM_WEBHOOK_SECRET"
              --env "TELEGRAM_STAGING_TENANT_ID=$TELEGRAM_STAGING_TENANT_ID"
            )
          fi

          if test "$RUN_AGENT_WORKER" = "true"; then
            deploy_args+=(
              --prod
              --env "CRON_SECRET=$CRON_SECRET"
              --env "TELEGRAM_STAGING_TENANT_ID=$TELEGRAM_STAGING_TENANT_ID"
            )
          fi

          if test "$CONFIGURE_OPENAI_SHADOW" = "true" -o "$RUN_PHASE10_SANDBOX" = "true" -o "$RUN_PHASE12_SANDBOX" = "true"; then
            deploy_args+=(
              --env "OPENAI_API_KEY=$OPENAI_API_KEY"
              --env "OPENAI_MODEL=$OPENAI_MODEL"
            )
          fi

          if test "$RUN_PHASE10_SANDBOX" = "true"; then
            deploy_args+=(
              --env "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
              --env "TELEGRAM_WEBHOOK_SECRET=$TELEGRAM_WEBHOOK_SECRET"
              --env "PAYMENT_TEST_WEBHOOK_SECRET=$PAYMENT_TEST_WEBHOOK_SECRET"
              --env "PAYMENT_TEST_WEBHOOKS_ENABLED=true"
            )
          fi
          if test "$RUN_PHASE12_SANDBOX" = "true"; then
            deploy_args+=(
              --env "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
              --env "TELEGRAM_WEBHOOK_SECRET=$TELEGRAM_WEBHOOK_SECRET"
              --env "PAYMENT_TEST_WEBHOOKS_ENABLED=false"
            )
          fi
          if test "${{ inputs.run_phase12_sandbox }}" = "true" && test -n "${ESCALATION_TELEGRAM_CHAT_ID:-}"; then
            deploy_args+=(
              --env "ESCALATION_NOTIFICATION_TENANT_ID=$PHASE12_TENANT_ID"
              --env "ESCALATION_TELEGRAM_CHAT_ID=$ESCALATION_TELEGRAM_CHAT_ID"
              --env "ESCALATION_TELEGRAM_BOT_ID=$ESCALATION_TELEGRAM_BOT_ID"
              --env "ESCALATION_TELEGRAM_BOT_TOKEN=$ESCALATION_TELEGRAM_BOT_TOKEN"
            )
          fi
          if test "${{ inputs.run_phase14_sandbox }}" = "true"; then
            deploy_args+=(--env "SURVEY_SANDBOX_FORMS_ENABLED=true")
          fi
          deployment_url=$(pnpm dlx vercel@59.16.0 deploy "${deploy_args[@]}")
          echo "url=$deployment_url" >>"$GITHUB_OUTPUT"
          echo "Staging URL: $deployment_url" >>"$GITHUB_STEP_SUMMARY"
          echo "Runtime secrets were attached to this deployment without writing values to the repository." >>"$GITHUB_STEP_SUMMARY"
      - name: Point canonical staging alias at validated artifact
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx vercel@59.16.0 alias set \
            "$DEPLOYMENT_URL" gold-revenue-os-staging.vercel.app \
            --scope="$VERCEL_TEAM_SLUG"
          echo "Canonical staging alias: https://gold-revenue-os-staging.vercel.app" >>"$GITHUB_STEP_SUMMARY"
      - name: Validate staging deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          # Vercel CLI authenticates from VERCEL_TOKEN and handles Preview
          # Deployment Protection. Arguments after -- are forwarded to curl.
          vercel_curl() {
            local path="$1"
            pnpm dlx vercel@59.16.0 curl "$path" --deployment "$DEPLOYMENT_URL" --scope="$VERCEL_TEAM_SLUG"
          }

          vercel_curl "/" >/dev/null
          vercel_curl "/login" >/dev/null
          vercel_curl "/api/health/live" | grep -q '"status":"ok"'
          vercel_curl "/api/health/ready" | grep -q '"status":"ready"'

          admin_status=$(pnpm dlx vercel@59.16.0 curl "/admin" --deployment "$DEPLOYMENT_URL" --scope="$VERCEL_TEAM_SLUG" -- --output /dev/null --write-out '%{http_code}')
          test "$admin_status" = "307" -o "$admin_status" = "302" -o "$admin_status" = "303"
      - name: Activate Phase 7 OpenAI provider in shadow mode
        if: ${{ inputs.configure_openai_shadow == true }}
        shell: bash
        run: |
          set -euo pipefail
          activation_file="$RUNNER_TEMP/phase7-openai-activation.json"
          curl --fail-with-body --silent --show-error \
            --header "apikey: $SUPABASE_SECRET_KEY" \
            --header "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            --header "Content-Type: application/json" \
            --data "$(jq -n --arg tenant "$TELEGRAM_STAGING_TENANT_ID" --arg model "$OPENAI_MODEL" '{target_tenant_id:$tenant,model_name_value:$model}')" \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/rpc/activate_phase7_openai_shadow" >"$activation_file"
          jq -e 'type == "string" and length == 36' "$activation_file" >/dev/null
          echo "Phase 7 provider activated in SHADOW mode; no model call was made by this step." >>"$GITHUB_STEP_SUMMARY"
      - name: Requeue owner-resolved OpenAI quota dead letters
        if: ${{ inputs.retry_resolved_openai_quota_tasks == true }}
        shell: bash
        run: |
          set -euo pipefail
          recovery_file="$RUNNER_TEMP/phase7-openai-quota-recovery.json"
          curl --fail-with-body --silent --show-error \
            --header "apikey: $SUPABASE_SECRET_KEY" \
            --header "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            --header "Content-Type: application/json" \
            --data "$(jq -n --arg tenant "$TELEGRAM_STAGING_TENANT_ID" '{target_tenant_id:$tenant,failure_code_value:"OPENAI_credit_balance_exhausted",reason_value:"owner_confirmed_billing_restored",max_tasks_value:25}')" \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/rpc/retry_resolved_agent_dead_letters" >"$recovery_file"
          jq -e '.requeued >= 0 and .requeued <= 25 and (.task_ids | type == "array")' "$recovery_file" >/dev/null
          jq '{requeued,correlation_id}' "$recovery_file" >>"$GITHUB_STEP_SUMMARY"
      - name: Drain and validate Phase 6 worker backlog without outbound messaging
        if: ${{ inputs.run_agent_worker == true && inputs.run_phase10_sandbox != true && inputs.run_phase11_sandbox != true && inputs.run_phase12_sandbox != true && inputs.run_phase13_sandbox != true && inputs.run_phase14_sandbox != true && inputs.run_phase15_sandbox != true }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            result_file="$RUNNER_TEMP/phase6-worker-$attempt.json"
            pnpm dlx vercel@59.16.0 curl "/api/internal/agent-worker" \
              --deployment "$DEPLOYMENT_URL" --scope="$VERCEL_TEAM_SLUG" \
              -- --header "Authorization: Bearer $CRON_SECRET" >"$result_file"
            jq -e '.status == "ok"' "$result_file" >/dev/null
            jq '{status,eventsClaimed,eventsCompleted,eventsFailed,tasksClaimed,tasksWaitingApproval,tasksFailed}' "$result_file" >>"$GITHUB_STEP_SUMMARY"
          done

          snapshot_file="$RUNNER_TEMP/phase6-runtime-snapshot.json"
          curl --fail-with-body --silent --show-error \
            --header "apikey: $SUPABASE_SECRET_KEY" \
            --header "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"target_tenant_id\":\"$TELEGRAM_STAGING_TENANT_ID\"}" \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/rpc/phase6_runtime_validation_snapshot" >"$snapshot_file"
          jq -e '.pending_outbox == 0 and .processing_outbox == 0 and .dead_letter_outbox == 0 and .outbound_kill_switch == false' "$snapshot_file" >/dev/null
          # Preserve existing failed tasks; never requeue or erase historical evidence.
          # The exact failure-ID set must remain unchanged, not merely its count.
          curl --fail-with-body --silent --show-error \
            --header "apikey: $SUPABASE_SECRET_KEY" \
            --header "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/agent_tasks?select=id&tenant_id=eq.$TELEGRAM_STAGING_TENANT_ID&status=eq.DEAD_LETTER&order=id" \
            >"$RUNNER_TEMP/phase6-final-failures.json"
          jq -e 'type == "array"' "$RUNNER_TEMP/phase6-final-failures.json" >/dev/null
          jq -S . "$RUNNER_TEMP/phase6-preserved-failures.json" >"$RUNNER_TEMP/phase6-preserved-failures.sorted.json"
          jq -S . "$RUNNER_TEMP/phase6-final-failures.json" >"$RUNNER_TEMP/phase6-final-failures.sorted.json"
          cmp "$RUNNER_TEMP/phase6-preserved-failures.sorted.json" "$RUNNER_TEMP/phase6-final-failures.sorted.json"
          test "$(jq '.agent_dead_letter' "$snapshot_file")" = "$(jq 'length' "$RUNNER_TEMP/phase6-final-failures.json")"
          jq . "$snapshot_file" >>"$GITHUB_STEP_SUMMARY"
      - name: Upload Phase 6 worker evidence
        if: ${{ always() && inputs.run_agent_worker == true }}
        uses: actions/upload-artifact@v4
        with:
          name: phase6-worker-validation-evidence
          path: |
            ${{ runner.temp }}/phase6-worker-*.json
            ${{ runner.temp }}/phase6-runtime-snapshot.json
            ${{ runner.temp }}/phase6-preserved-failures.json
            ${{ runner.temp }}/phase6-final-failures.json
            ${{ runner.temp }}/phase7-openai-quota-recovery.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate Phase 7 quality runtime evidence
        if: ${{ inputs.configure_openai_shadow == true || inputs.verify_openai_evidence == true }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot_file="$RUNNER_TEMP/phase7-quality-snapshot.json"
          curl --fail-with-body --silent --show-error \
            --header "apikey: $SUPABASE_SECRET_KEY" \
            --header "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"target_tenant_id\":\"$TELEGRAM_STAGING_TENANT_ID\"}" \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/rpc/phase7_quality_validation_snapshot" >"$snapshot_file"
          jq -e '.active_provider == "openai" and .execution_mode == "SHADOW" and .autonomous_messaging_enabled == false and .outbound_kill_switch == false and .historical_import_locked == true' "$snapshot_file" >/dev/null
          if test "${{ inputs.verify_openai_evidence }}" = "true"; then
            jq -e '.openai_invocations >= 3 and .quality_evaluations >= 3' "$snapshot_file" >/dev/null
          fi
          jq . "$snapshot_file" >>"$GITHUB_STEP_SUMMARY"
      - name: Upload Phase 7 quality evidence
        if: ${{ always() && (inputs.configure_openai_shadow == true || inputs.verify_openai_evidence == true) }}
        uses: actions/upload-artifact@v4
        with:
          name: phase7-quality-validation-evidence
          path: |
            ${{ runner.temp }}/phase7-openai-activation.json
            ${{ runner.temp }}/phase7-quality-snapshot.json
          if-no-files-found: warn
          retention-days: 14
      - name: Enable Phase 8 deterministic orchestration after verified deployment
        if: ${{ inputs.enable_phase8_orchestration == true }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.run_agent_worker }}" = "true"
          test "$TELEGRAM_STAGING_TENANT_ID" = "e372b64d-2066-4939-baf6-6c0540c2f605"
          curl --fail-with-body --silent --show-error \
            --header "apikey: $SUPABASE_SECRET_KEY" \
            --header "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"target_tenant_id\":\"$TELEGRAM_STAGING_TENANT_ID\",\"enabled_value\":true}" \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/rpc/configure_phase8_orchestration" \
            | jq -e '. == true' >/dev/null
          echo "Phase 8 enabled for fresh sources only; no messages or model calls initiated." >>"$GITHUB_STEP_SUMMARY"
      - name: Register and validate Telegram staging webhook
        if: ${{ inputs.run_telegram_live == true }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          canonical_url="${NEXT_PUBLIC_APP_URL%/}"
          webhook_url="$canonical_url/api/webhooks/telegram"

          ready_body="$RUNNER_TEMP/telegram-ready.json"
          ready_status=$(curl --silent --show-error --output "$ready_body" --write-out '%{http_code}' \
            "$canonical_url/api/webhooks/telegram")
          echo "Telegram webhook readiness HTTP status: $ready_status"
          test "$ready_status" = "200"
          jq -e '.status == "telegram-webhook-ready"' "$ready_body" >/dev/null

          invalid_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' \
            --header 'x-telegram-bot-api-secret-token: invalid-secret' \
            --data '{"update_id":1}' "$webhook_url")
          echo "Telegram invalid-secret probe HTTP status: $invalid_status"
          test "$invalid_status" = "401"

          malformed_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' \
            --header "x-telegram-bot-api-secret-token: $TELEGRAM_WEBHOOK_SECRET" \
            --data '{"update_id":1}' "$webhook_url")
          echo "Telegram configured-secret malformed-payload probe HTTP status: $malformed_status"
          test "$malformed_status" = "400"

          bot_info="$RUNNER_TEMP/telegram-bot-info.json"
          bot_status=$(curl --silent --show-error --output "$bot_info" --write-out '%{http_code}' \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")
          echo "Telegram getMe HTTP status: $bot_status"
          test "$bot_status" = "200"
          if ! jq -e '.ok == true and .result.is_bot == true and .result.username == "gold_revenue_os_staging_bot"' "$bot_info" >/dev/null; then
            echo "::error::Telegram getMe did not resolve the expected staging bot identity."
            jq -r '.description // "Unexpected Telegram getMe response"' "$bot_info"
            exit 1
          fi

          set_webhook_response="$RUNNER_TEMP/telegram-set-webhook.json"
          set_webhook_status=$(curl --silent --show-error --output "$set_webhook_response" --write-out '%{http_code}' \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=$webhook_url" \
            --data-urlencode "secret_token=$TELEGRAM_WEBHOOK_SECRET" \
            --data-urlencode 'allowed_updates=["message"]' \
            --data-urlencode 'drop_pending_updates=true')
          echo "Telegram setWebhook HTTP status: $set_webhook_status"
          test "$set_webhook_status" = "200"
          if ! jq -e '.ok == true' "$set_webhook_response" >/dev/null; then
            echo "::error::Telegram rejected setWebhook."
            jq -r '.description // "Unexpected Telegram setWebhook response"' "$set_webhook_response"
            exit 1
          fi

          webhook_info="$RUNNER_TEMP/telegram-webhook-info.json"
          webhook_info_status=$(curl --silent --show-error --output "$webhook_info" --write-out '%{http_code}' \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo")
          echo "Telegram getWebhookInfo HTTP status: $webhook_info_status"
          test "$webhook_info_status" = "200"
          test "$(jq -r '.ok' "$webhook_info")" = "true"
          test "$(jq -r '.result.url' "$webhook_info")" = "$webhook_url"
          test "$(jq -r '.result.has_custom_certificate' "$webhook_info")" = "false"
          if test "$(jq -r '.result.last_error_message // empty' "$webhook_info")" != ""; then
            echo "::error::Telegram reports a webhook delivery error."
            jq -r '.result.last_error_message' "$webhook_info"
            exit 1
          fi

          echo "Telegram staging webhook registered at the canonical HTTPS endpoint." >>"$GITHUB_STEP_SUMMARY"
      - name: Install Supabase CLI in the Vercel sandbox validation job
        if: ${{ inputs.run_phase10_sandbox == true || inputs.run_phase11_sandbox == true || inputs.run_phase12_sandbox == true || inputs.run_phase13_sandbox == true || inputs.run_phase14_sandbox == true || inputs.run_phase15_sandbox == true }}
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Run isolated Phase 10 sandbox and Admin Payments acceptance
        if: ${{ inputs.run_phase10_sandbox == true }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VALIDATED_SHA: ${{ inputs.validated_commit_sha }}
          PHASE10_EVIDENCE_FILE: ${{ runner.temp }}/phase10-owner-acceptance.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$STAGING_SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          node apps/web/scripts/phase10-staging.mjs
      - name: Upload sanitized Phase 10 sandbox evidence
        if: ${{ always() && inputs.run_phase10_sandbox == true }}
        uses: actions/upload-artifact@v4
        with:
          name: phase10-owner-acceptance
          path: ${{ runner.temp }}/phase10-owner-acceptance.json
          retention-days: 14
      - name: Run isolated Phase 11 subscription and authenticated Admin acceptance
        if: ${{ inputs.run_phase11_sandbox == true }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VALIDATED_SHA: ${{ inputs.validated_commit_sha }}
          PHASE11_EVIDENCE_FILE: ${{ runner.temp }}/phase11-owner-acceptance.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$STAGING_SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          node apps/web/scripts/phase11-staging.mjs
      - name: Upload sanitized Phase 11 evidence
        if: ${{ always() && inputs.run_phase11_sandbox == true }}
        uses: actions/upload-artifact@v4
        with:
          name: phase11-owner-acceptance
          path: ${{ runner.temp }}/phase11-owner-acceptance.json
          retention-days: 14
      - name: Run isolated Phase 12 escalation and authenticated Admin acceptance
        if: ${{ inputs.run_phase12_sandbox == true }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VALIDATED_SHA: ${{ inputs.validated_commit_sha }}
          PHASE12_EVIDENCE_FILE: ${{ runner.temp }}/phase12-owner-acceptance.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$STAGING_SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          node apps/web/scripts/phase12-staging.mjs
      - name: Upload sanitized Phase 12 evidence
        if: ${{ always() && inputs.run_phase12_sandbox == true }}
        uses: actions/upload-artifact@v4
        with:
          name: phase12-owner-acceptance
          path: ${{ runner.temp }}/phase12-owner-acceptance.json
          retention-days: 14
      - name: Run isolated Phase 13 Customer Success and localized Admin acceptance
        if: ${{ inputs.run_phase13_sandbox == true }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VALIDATED_SHA: ${{ inputs.validated_commit_sha }}
          PHASE13_EVIDENCE_FILE: ${{ runner.temp }}/phase13-owner-acceptance.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
        run: |
